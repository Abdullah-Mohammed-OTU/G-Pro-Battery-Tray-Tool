name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --noconsole
          --name SuperlightBattery
          --hidden-import pystray._win32
          superlight_battery.py

      - name: Smoke test (imports load)
        run: python -c "import hid, pystray, PIL; import superlight_battery"

      - uses: actions/upload-artifact@v4
        with:
          name: SuperlightBattery
          path: dist/SuperlightBattery.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SuperlightBattery.exe
          generate_release_notes: true
